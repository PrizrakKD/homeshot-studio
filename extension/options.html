<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Homeshot: настройки</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#14110F;color:#F2ECE4;font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:48px auto;padding:0 16px;display:grid;gap:18px}
h1{font-size:22px;margin:0}
p{margin:0;color:#B0A598}
a{color:#D6A870}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;color:#B0A598;text-transform:uppercase;margin-bottom:6px}
input{width:100%;height:44px;padding:0 12px;border-radius:6px;border:1px solid #2E2823;background:#1C1815;color:#F2ECE4;font:500 14px inherit;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{height:46px;padding:0 22px;border:0;border-radius:999px;background:#D6A870;color:#14110F;font:600 15px inherit;cursor:pointer;justify-self:start}
#st{color:#D6A870;min-height:1.4em}
#st.err{color:#E8907A}
</style>
</head>
<body>
<main>
  <h1>Homeshot: настройки</h1>
  <p>Нужен тот же GitHub-токен, что и для админки (доступ к репозиторию homeshot-studio, Contents: Read and write). <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Создать токен</a></p>
  <div><label for="token">GitHub-токен</label><input type="password" id="token" autocomplete="off" placeholder="github_pat_…"></div>
  <div class="row">
    <div><label for="owner">Владелец</label><input type="text" id="owner"></div>
    <div><label for="repo">Репозиторий</label><input type="text" id="repo"></div>
  </div>
  <button type="button" id="save">Сохранить и проверить</button>
  <div id="st" role="status"></div>
</main>
<script src="options.js"></script>
</body>
</html>
